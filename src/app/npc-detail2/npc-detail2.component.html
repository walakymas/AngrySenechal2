<div class="row">
        <h2>Description</h2>
        <span class="contrastedText">{{char['description']}}</span>
        <br/>
        <span class="contrastedText">{{char['longdescription']}}</span>
</div>

<div class="row">
    <div class="col-1"><h2 id="mainhead">Main </h2>
        <ul id='main' *ngIf="char['main']">
            <ng-container *ngFor="let m of char['main'] | keyvalue ">
                <li *ngIf="!isEq(''+m.key, 'Glory')">
                    <span class="gold" >{{m.key}}</span> {{m.value}}
                </li>
            </ng-container>
        </ul>

    </div> <!-- 33.33% -->
    <div class="col-1"><h2 id="stathead">Statistics</h2>
        <ul id="statistics">
            <li><span class="gold">SIZ</span>{{char['stats']['siz']}}</li>
            <li><span class="gold">DEX</span>{{char['stats']['dex']}}</li>
            <li><span class="gold">STR</span>{{char['stats']['str']}}</li>
            <li><span class="gold">CON</span>{{char['stats']['con']}}</li>
            <li><span class="gold">APP</span>{{char['stats']['app']}}</li>
        </ul>

    </div> <!-- 33.33% -->
    <div class="col-1">
        <div>
            <h2 id="stathead">
                {{char['name']}}
            </h2>
        </div>
        <div style="text-align: center"><img class="Image-Frame" id='charimg' src="{{char['url']}}" width="200"> </div>
    </div> <!-- 33.33% -->
</div>
