<div>
  <mat-tab-group>
    @for (c of categories; track c) {
      <mat-tab [label]="c">
        <div class="maps-grid">
          @for (m of grouped[c]; track m) {
            <div class="map-item" (click)="showPreview($event, m)">
              @if (isPdf(m)) {
                <div class="pdf-thumb"><mat-icon>picture_as_pdf</mat-icon><span>PDF</span></div>
              } @else {
                <img class="thumb" [src]="m.url" [alt]="m.name || m.id"/>
              }
              <div class="map-caption"  (click)="editMap($event, m)">{{m.name || m.url}}</div>
            </div>
          }
        </div>
      </mat-tab>
    }
  </mat-tab-group>

  @if (currentPreview) {
    <div class="preview">
      @if (isPdf(currentPreview)) {
        <iframe class="pdf-frame" [src]="pdfUrl(currentPreview)" [title]="currentPreview.name || 'PDF'"></iframe>
        <a class="pdf-open" [href]="currentPreview.url" target="_blank" rel="noopener noreferrer">Open in new tab</a>
      } @else {
        <img [src]="currentPreview.url" [alt]="currentPreview.name || currentPreview.id"/>
      }
    </div>
  }
</div>
