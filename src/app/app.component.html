<nav><div class="hidePrint">
  <button mat-icon-button [matMenuTriggerFor]="mainMenu">
    <mat-icon>more_vert</mat-icon>
  </button>
  <mat-menu #mainMenu="matMenu">
    <button mat-menu-item (click)="newChar()"><mat-icon>person_add</mat-icon>New character</button>
    <button mat-menu-item routerLink="feast"><mat-icon>nightlife</mat-icon>Feast</button>
  </mat-menu>
  <button mat-button [matMenuTriggerFor]="players">
    <mat-icon>local_police</mat-icon>
    Players
  </button>
  <mat-menu #players="matMenu">
    <ng-container *ngFor="let c of list" >
      <button mat-menu-item *ngIf="isPc(c)" routerLink="character/{{c.name}}">
        <mat-icon >security</mat-icon>
        {{c.name}}
      </button>
    </ng-container>
  </mat-menu>
  <button mat-button [matMenuTriggerFor]="all"><mat-icon>switch_account</mat-icon>All</button>
  <mat-menu #all="matMenu">

    <button mat-menu-item [matMenuTriggerFor]="Lords"><mat-icon>male</mat-icon>Lords</button>
    <button mat-menu-item [matMenuTriggerFor]="Ladies"><mat-icon>female</mat-icon>Ladies</button>
    <button mat-menu-item [matMenuTriggerFor]="Other"><mat-icon>transgender</mat-icon>Other</button>
  </mat-menu>
  <mat-menu #Ladies="matMenu">
    <ng-container *ngFor="let c of list" >
      <button mat-menu-item *ngIf="isLady(c)" routerLink="character/{{c.name}}">{{c.name}}</button>
    </ng-container>
  </mat-menu>
  <mat-menu #Lords="matMenu">
    <ng-container *ngFor="let c of list" >
      <button mat-menu-item *ngIf="isLord(c)" routerLink="character/{{c.name}}">{{c.name}}</button>
    </ng-container>
  </mat-menu>
  <mat-menu #Other="matMenu">
    <ng-container *ngFor="let c of list" >
      <button mat-menu-item *ngIf="isOther(c)" routerLink="character/{{c.name}}">{{c.name}}</button>
    </ng-container>
  </mat-menu>
  <button mat-button *ngIf="isLoggedIn()" [matMenuTriggerFor]="myChars"><mat-icon>account_circle</mat-icon>MyCharacters</button>
  <mat-menu #myChars="matMenu">
    <ng-container *ngFor="let c of myCharacters()">
      <button mat-menu-item routerLink="character/{{c.name}}">{{c.name}}</button>
    </ng-container>
  </mat-menu>
  <button mat-button routerLink="team">
    <mat-icon>groups</mat-icon>
    Team
  </button>
  <button mat-button routerLink="maps">
    <mat-icon>map</mat-icon>
    Maps
  </button>
  <span class="spacer"></span>
  <button mat-button *ngIf="!hasToken()" (click)="loginWithDiscord()"><mat-icon>login</mat-icon>Login with Discord</button>
  <button mat-button *ngIf="hasToken()" (click)="logout()"><mat-icon>logout</mat-icon>Logout</button>
  <span *ngIf="isLoggedIn()" class="user-name">{{user.name}}</span>
</div><div></div>
</nav>
<router-outlet></router-outlet>
<app-messages></app-messages>
