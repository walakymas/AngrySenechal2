<div class="rolls">
  <div class="rolls-filter hidePrint">
    <mat-form-field appearance="fill">
      <mat-label>Player</mat-label>
      <mat-select [value]="player || 0" (selectionChange)="setPlayer($event.value)">
        <mat-option [value]="0">All characters</mat-option>
        @for (p of players; track p.id) {
          <mat-option [value]="p.id">{{p.label}}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="fill" class="rolls-limit">
      <mat-label>Rolls</mat-label>
      <mat-select [value]="limit" (selectionChange)="setLimit($event.value)">
        @for (n of limits; track n) {
          <mat-option [value]="n">{{n}}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <span class="rolls-count">{{checks.length}} / {{limit}} rolls</span>
  </div>
  <div class="rolls-list">
    @for (c of checks; track c.id) {
      <check-card [check]="c" [showTime]="true"></check-card>
    }
  </div>
  @if (checks.length == 0) {
    <div class="rolls-empty">No rolls yet.</div>
  }
</div>
